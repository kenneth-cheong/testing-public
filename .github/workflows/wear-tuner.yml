name: Wear Tuner

on:
  pull_request:
    paths:
      - "wear-tuner/**"
      - ".github/workflows/wear-tuner.yml"
  push:
    branches: [main]
    paths:
      - "wear-tuner/**"
      - ".github/workflows/wear-tuner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear-tuner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wear-tuner-debug-apk
          path: wear-tuner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
